name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Lispico
        run: nix-build -A lispico

      - name: Run examples tests
        run: bash tests/run-examples.sh
        env:
          LISPICO_EXECUTABLE: ./result/bin/lispico
